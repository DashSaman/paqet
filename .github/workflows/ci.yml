name: CI

on:
  push:
    branches:
      - master
      - "perf/**"
      - "audit/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Check installer syntax
        run: bash -n scripts/install-linux.sh

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build
        run: go build -o /tmp/paqet ./cmd
